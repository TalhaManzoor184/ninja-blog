name: Restore original URLs (dates)

# Puts posts back on the URLs Google knows (/YYYY/MM/DD/slug/) using content/original_urls.txt.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show what would change"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore dates
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python -m agent.main restore-dates ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Save report
        run: |
          git config user.name "ninja-blog-agent"
          git config user.email "actions@users.noreply.github.com"
          git add state/restore-urls.md
          git diff --cached --quiet && exit 0
          git commit -m "Restore URLs report $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
