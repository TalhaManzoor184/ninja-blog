name: Daily blog post

on:
  schedule:
    # 04:23 UTC = 9:23 AM Pakistan time. GitHub sometimes starts scheduled runs late; that is fine for a blog.
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      post_id:
        description: "WordPress post ID to rewrite (blank = next in the queue)"
        required: false
      count:
        description: "How many posts this run (blank = POSTS_PER_DAY or config.yaml)"
        required: false
      dry_run:
        description: "Preview only: write the article as a downloadable artifact, change nothing in WordPress"
        type: boolean
        default: false
      publish:
        description: "Publish (unticked = save the rewrite but keep it a draft)"
        type: boolean
        default: true

concurrency:
  group: ninja-blog-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Mermaid CLI (diagrams)
        run: npm install -g @mermaid-js/mermaid-cli@11 >/dev/null 2>&1 || echo "mermaid-cli not installed; articles go out without diagrams"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Write today's post
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          POSTS_PER_DAY: ${{ inputs.count || vars.POSTS_PER_DAY }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && (inputs.publish && 'true' || 'false') || vars.PUBLISH }}
          DUPLICATE_ACTION: ${{ vars.DUPLICATE_ACTION }}
        run: |
          args="run"
          [ -n "${{ inputs.post_id }}" ] && args="$args --post-id ${{ inputs.post_id }}"
          [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          python -m agent.main $args

      - name: Upload preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-preview
          path: output/
          retention-days: 7
          if-no-files-found: ignore

      - name: Save progress
        if: always() && inputs.dry_run != true
        run: |
          git config user.name "ninja-blog-agent"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "Blog agent: progress $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
