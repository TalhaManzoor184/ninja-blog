name: Change a post's URL slug

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "WordPress post ID"
        required: true
      slug:
        description: "New slug (lowercase-with-dashes). Only for posts Google has not indexed yet."
        required: true

permissions:
  contents: read

jobs:
  slug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python -m agent.main set-slug --post-id "${{ inputs.post_id }}" --slug "${{ inputs.slug }}"
